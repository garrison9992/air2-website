    <title>Permissions — AIR²Aim</title>
    <style>
        :root {
            --text-primary: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.72);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            color: var(--text-primary);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* --- 背景容器与视差图层 --- */
        .bg-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #111111;
            z-index: -1;
        }

        .parallax-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-image: url('../bg1.jpg');
            transform: scale(1.05);
            animation: bgInitialZoom 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @media (max-width: 768px) {
            .parallax-bg {
                background-image: url('../bg2.jpg');
            }
        }

        @keyframes bgInitialZoom {
            0% {
                opacity: 0;
                transform: scale(1.12);
            }
            30% {
                opacity: 0.5;
            }
            100% {
                opacity: 1;
                transform: scale(1.05);
            }
        }

        @keyframes contentFadeIn {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- 单页紧凑容器 --- */
        .standalone-container {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 48px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            animation: contentFadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards;
            opacity: 0;
        }

        @media (max-width: 768px) {
            .standalone-container {
                padding: 18px 18px 24px 18px;
            }
        }

        .page-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
        }

        .page-brand-sm {
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            word-spacing: -0.15em;
            color: #ffffff;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        .page-brand-sm:hover {
            opacity: 0.85;
        }

        .top-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* --- 地球语言切换下拉 --- */
        .lang-dropdown {
            position: relative;
        }

        .lang-globe-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #ffffff;
            font-size: 0.72rem;
            letter-spacing: 0.04em;
            padding: 5px 11px;
            border-radius: 999px;
            cursor: pointer;
            transition: border-color 0.25s ease, background-color 0.25s ease;
        }

        .lang-globe-btn:hover,
        .lang-dropdown.open .lang-globe-btn {
            background: rgba(255, 255, 255, 0.16);
            border-color: #ffffff;
        }

        .lang-menu {
            display: none;
            position: absolute;
            right: 0;
            top: calc(100% + 6px);
            min-width: 128px;
            background: rgba(20, 20, 22, 0.94);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            padding: 4px;
            z-index: 30;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        }

        .lang-dropdown.open .lang-menu {
            display: block;
        }

        .lang-option {
            width: 100%;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 0.8rem;
            text-align: left;
            padding: 7px 10px;
            border-radius: 7px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s ease;
        }

        .lang-option:hover {
            background: rgba(255, 255, 255, 0.14);
        }

        .lang-option.active {
            background: rgba(255, 255, 255, 0.2);
            font-weight: 600;
        }

        /* --- 喇叭 TTS 开关 --- */
        .tts-toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #ffffff;
            font-size: 0.72rem;
            letter-spacing: 0.04em;
            padding: 5px 11px;
            border-radius: 999px;
            cursor: pointer;
            transition: opacity 0.25s ease, border-color 0.25s ease, background-color 0.25s ease;
        }

        .tts-toggle-btn.active {
            background: rgba(255, 255, 255, 0.16);
            border-color: #ffffff;
            opacity: 1;
        }

        .tts-toggle-btn:not(.active) {
            opacity: 0.65;
        }

        .tts-toggle-btn .icon-mute {
            display: none;
        }

        .tts-toggle-btn:not(.active) .icon-sound {
            display: none;
        }

        .tts-toggle-btn:not(.active) .icon-mute {
            display: inline-block;
        }

        .page-body {
            margin: 14px auto;
            max-width: 820px;
            width: 100%;
        }

        .page-header-row {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px 16px;
            margin-bottom: 12px;
        }

        .page-body h2 {
            font-size: clamp(1.5rem, 2.8vw, 2rem);
            font-weight: 400;
            letter-spacing: -0.02em;
            line-height: 1.15;
            color: #ffffff;
        }

        .page-lead {
            font-size: 0.84rem;
            line-height: 1.45;
            color: var(--text-muted);
        }

        /* --- 紧凑和缓折叠下拉窗区域 --- */
        .accordion-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .info-details {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 10px;
            overflow: hidden;
            transition: border-color 0.28s ease, background-color 0.28s ease;
        }

        .info-details.is-open {
            border-color: rgba(255, 255, 255, 0.42);
            background: rgba(0, 0, 0, 0.36);
        }

        .info-summary {
            padding: 9px 14px;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .info-summary::after {
            content: "+";
            font-size: 1.05rem;
            font-weight: 300;
            line-height: 1;
            transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
            margin-left: 12px;
        }

        .info-details.is-open .info-summary::after {
            transform: rotate(45deg);
        }

        .info-summary::-webkit-details-marker {
            display: none;
        }

        .info-collapse {
            display: grid;
            grid-template-rows: 0fr;
            opacity: 0;
            transition: grid-template-rows 0.36s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.28s ease;
        }

        .info-details.is-open .info-collapse {
            grid-template-rows: 1fr;
            opacity: 1;
        }

        .info-collapse-inner {
            overflow: hidden;
        }

        .info-content {
            padding: 9px 14px 12px 14px;
            font-size: 0.83rem;
            line-height: 1.55;
            color: rgba(255, 255, 255, 0.9);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
        }

        .info-content p {
            margin-bottom: 5px;
        }

        .info-content p:last-child {
            margin-bottom: 0;
        }

            max-width: 820px;
            width: 100%;
            margin: 6px auto 0 auto;
            padding-top: 8px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 8px 16px;
            font-size: 0.74rem;
            color: var(--text-muted);
        }

        .footer-contact a {
            color: #ffffff;
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.35);
            padding-bottom: 1px;
        }

        .footer-meta {
            text-align: right;
            line-height: 1.4;
        }

        @media (max-width: 768px) {
            .footer-meta {
                text-align: left;
            }
        }
    </style>
</head>

};

            const accordionSection = document.getElementById('accordionSection');
            const pageTitle = document.getElementById('pageTitle');
            const pageLead = document.getElementById('pageLead');
            const supportPrefix = document.getElementById('supportPrefix');
            const footerBadge = document.getElementById('footerBadge');
            const currentLangCode = document.getElementById('currentLangCode');
            const langDropdown = document.getElementById('langDropdown');
            const langGlobeBtn = document.getElementById('langGlobeBtn');
            const langOptions = document.querySelectorAll('.lang-option');
            const ttsToggle = document.getElementById('ttsToggle');
            const ttsLabel = document.getElementById('ttsLabel');

            const supportsTTS = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
            let isTtsEnabled = supportsTTS;
            let activeLang = 'en';
            let speechSessionId = 0;
            const activeUtterances = [];

            function detectInitialLanguage() {
                const params = new URLSearchParams(window.location.search);
                const queryLang = (params.get('lang') || '').toLowerCase().split('-')[0];
                if (queryLang && Object.prototype.hasOwnProperty.call(I18N, queryLang)) {
                    return queryLang;
                }

                const systemLangs = Array.isArray(navigator.languages) && navigator.languages.length > 0
                    ? navigator.languages
                    : [navigator.language || navigator.userLanguage || 'en'];

                for (let i = 0; i < systemLangs.length; i++) {
                    const code = String(systemLangs[i] || '').toLowerCase().trim();
                    const base = code.split('-')[0];
                    if (Object.prototype.hasOwnProperty.call(I18N, base)) {
                        return base;
                    }
                }
                return 'en';
            }

            function stopSpeaking() {
                speechSessionId += 1;
                activeUtterances.length = 0;
                if (supportsTTS) {
                    window.speechSynthesis.cancel();
                }
            }

            function normalizeSpeechText(rawText) {
                return String(rawText || '')
                    .replace(/AIR²Aim/gi, 'Air 2 Aim')
                    .replace(/•/g, '，')
                    .replace(/\s+/g, ' ')
                    .trim();
            }

            function getCardSpeechText(cardEl) {
                const summaryEl = cardEl.querySelector('.info-summary');
                const contentEl = cardEl.querySelector('.info-content');
                const summaryText = summaryEl ? summaryEl.textContent : '';
                const paragraphTexts = contentEl
                    ? Array.from(contentEl.querySelectorAll('p')).map(function (p) {
                        return p.textContent || '';
                    })
                    : [];
                return normalizeSpeechText([summaryText].concat(paragraphTexts).join('。'));
            }

            function splitIntoChunks(text) {
                const cleaned = normalizeSpeechText(text);
                if (!cleaned) return [];
                const parts = cleaned.match(/[^。！？；.!?;]+(?:[。！？；.!?;]+|$)/g);
                return parts ? parts.map(function (s) { return s.trim(); }).filter(Boolean) : [cleaned];
            }

            function speakText(text) {
                if (!supportsTTS || !isTtsEnabled || !text) return;

                stopSpeaking();
                const sessionId = speechSessionId;
                const chunks = splitIntoChunks(text);
                if (!chunks.length) return;

                if (window.speechSynthesis.paused) {
                    window.speechSynthesis.resume();
                }

                chunks.forEach(function (chunk) {
                    const utterance = new SpeechSynthesisUtterance(chunk);
                    utterance.lang = I18N[activeLang]?.ttsLang || 'en-US';
                    utterance.rate = 0.95;
                    utterance.onstart = function () {
                        if (sessionId !== speechSessionId) {
                            window.speechSynthesis.cancel();
                        }
                    };
                    activeUtterances.push(utterance);
                    window.speechSynthesis.speak(utterance);
                });
            }

            function updateToggleUI() {
                if (!supportsTTS) {
                    ttsLabel.textContent = 'off';
                    ttsToggle.classList.remove('active');
                    return;
                }
                ttsLabel.textContent = isTtsEnabled ? 'on' : 'off';
                ttsToggle.classList.toggle('active', isTtsEnabled);
            }

            function setCardOpen(cardEl, shouldOpen) {
                const detailEl = cardEl.querySelector('details');
                if (shouldOpen) {
                    detailEl.open = true;
                    cardEl.classList.add('is-open');
                } else {
                    cardEl.classList.remove('is-open');
                    detailEl.open = false;
                }
            }

            function renderLanguage(langKey) {
                const pack = I18N[langKey] || I18N.en;
                activeLang = Object.prototype.hasOwnProperty.call(I18N, langKey) ? langKey : 'en';
                stopSpeaking();

                document.documentElement.lang = pack.htmlLang;
                document.title = pack.docTitle;
                pageTitle.textContent = pack.heading;
                pageLead.textContent = pack.lead;
                supportPrefix.textContent = pack.supportPrefix;
                footerBadge.textContent = pack.footerBadge;
                currentLangCode.textContent = pack.label;

                langOptions.forEach(function (opt) {
                    opt.classList.toggle('active', opt.getAttribute('data-lang') === activeLang);
                });

                accordionSection.innerHTML = '';

                pack.items.forEach(function (item) {
                    const card = document.createElement('div');
                    card.className = 'info-details';

                    const detail = document.createElement('details');

                    const summary = document.createElement('summary');
                    summary.className = 'info-summary';
                    summary.textContent = item.summary;

                    const collapse = document.createElement('div');
                    collapse.className = 'info-collapse';

                    const collapseInner = document.createElement('div');
                    collapseInner.className = 'info-collapse-inner';

                    const content = document.createElement('div');
                    content.className = 'info-content';
                    item.paragraphs.forEach(function (htmlStr) {
                        const p = document.createElement('p');
                        p.innerHTML = htmlStr;
                        content.appendChild(p);
                    });

                    summary.addEventListener('click', function (e) {
                        e.preventDefault();
                        const currentlyOpen = card.classList.contains('is-open');
                        const allCards = accordionSection.querySelectorAll('.info-details');
                        allCards.forEach(function (other) {
                            if (other !== card && other.classList.contains('is-open')) {
                                setCardOpen(other, false);
                            }
                        });

                        if (!currentlyOpen) {
                            setCardOpen(card, true);
                            speakText(getCardSpeechText(card));
                        } else {
                            setCardOpen(card, false);
                            stopSpeaking();
                        }
                    });

                    content.addEventListener('click', function () {
                        speakText(getCardSpeechText(card));
                    });

                    collapseInner.appendChild(content);
                    collapse.appendChild(collapseInner);
                    detail.appendChild(summary);
                    detail.appendChild(collapse);
                    card.appendChild(detail);
                    accordionSection.appendChild(card);
                });
            }

            langGlobeBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                const willOpen = !langDropdown.classList.contains('open');
                langDropdown.classList.toggle('open', willOpen);
                langGlobeBtn.setAttribute('aria-expanded', String(willOpen));
            });

            langOptions.forEach(function (opt) {
                opt.addEventListener('click', function (e) {
                    e.stopPropagation();
                    const chosen = opt.getAttribute('data-lang');
                    langDropdown.classList.remove('open');
                    langGlobeBtn.setAttribute('aria-expanded', 'false');
                    renderLanguage(chosen);
                });
            });

            document.addEventListener('click', function (e) {
                if (!langDropdown.contains(e.target)) {
                    langDropdown.classList.remove('open');
                    langGlobeBtn.setAttribute('aria-expanded', 'false');
                }
            });

            ttsToggle.addEventListener('click', function () {
                if (!supportsTTS) return;
                isTtsEnabled = !isTtsEnabled;
                updateToggleUI();
                if (!isTtsEnabled) {
                    stopSpeaking();
                } else {
                    const openCard = accordionSection.querySelector('.info-details.is-open');
                    if (openCard) {
                        speakText(getCardSpeechText(openCard));
                    }
                }
            });

            window.addEventListener('pagehide', stopSpeaking);
            window.addEventListener('beforeunload', stopSpeaking);
            document.addEventListener('visibilitychange', function () {
                if (document.hidden) {
                    stopSpeaking();
                }
            });

            updateToggleUI();
            renderLanguage(detectInitialLanguage());
        })();
    </script>
</body>
</html>
