<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Feedback — AIR²Aim</title>
    <style>
        :root {
            --text-primary: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.72);
            --accent-ok: #9ae6b4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            color: var(--text-primary);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-weight: 400;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .bg-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #111111;
            z-index: -1;
        }

        .parallax-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-image: url('../bg1.jpg');
            transform: scale(1.05);
            animation: bgInitialZoom 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @media (max-width: 768px) {
            .parallax-bg {
                background-image: url('../bg2.jpg');
            }
        }

        @keyframes bgInitialZoom {
            0% {
                opacity: 0;
                transform: scale(1.12);
            }
            30% {
                opacity: 0.5;
            }
            100% {
                opacity: 1;
                transform: scale(1.05);
            }
        }

        @keyframes contentFadeIn {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .standalone-container {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 48px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            animation: contentFadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards;
            opacity: 0;
        }

        @media (max-width: 768px) {
            .standalone-container {
                padding: 18px 18px 24px 18px;
            }
        }

        .page-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
        }

        .page-brand-sm {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            word-spacing: -0.15em;
            color: #ffffff;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        .page-brand-sm:hover {
            opacity: 0.85;
        }

        .top-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lang-dropdown {
            position: relative;
        }

        .lang-globe-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #ffffff;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 0.82rem;
            font-weight: 400;
            letter-spacing: 0.04em;
            padding: 5px 11px;
            border-radius: 999px;
            cursor: pointer;
            transition: border-color 0.25s ease, background-color 0.25s ease;
        }

        .lang-globe-btn:hover,
        .lang-dropdown.open .lang-globe-btn {
            background: rgba(255, 255, 255, 0.16);
            border-color: #ffffff;
        }

        .lang-menu {
            display: none;
            position: absolute;
            right: 0;
            top: calc(100% + 6px);
            min-width: 128px;
            background: rgba(20, 20, 22, 0.94);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            padding: 4px;
            z-index: 30;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        }

        .lang-dropdown.open .lang-menu {
            display: block;
        }

        .lang-option {
            width: 100%;
            background: transparent;
            border: none;
            color: #ffffff;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 0.92rem;
            font-weight: 400;
            text-align: left;
            padding: 7px 10px;
            border-radius: 7px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s ease;
        }

        .lang-option:hover {
            background: rgba(255, 255, 255, 0.14);
        }

        .lang-option.active {
            background: rgba(255, 255, 255, 0.2);
            font-weight: 500;
        }

        .tts-toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #ffffff;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 0.82rem;
            font-weight: 400;
            letter-spacing: 0.04em;
            padding: 5px 11px;
            border-radius: 999px;
            cursor: pointer;
            transition: opacity 0.25s ease, border-color 0.25s ease, background-color 0.25s ease;
        }

        .tts-toggle-btn.active {
            background: rgba(255, 255, 255, 0.16);
            border-color: #ffffff;
            opacity: 1;
        }

        .tts-toggle-btn:not(.active) {
            opacity: 0.65;
        }

        .tts-toggle-btn .icon-mute {
            display: none;
        }

        .tts-toggle-btn:not(.active) .icon-sound {
            display: none;
        }

        .tts-toggle-btn:not(.active) .icon-mute {
            display: inline-block;
        }

        .page-body {
            margin: 16px auto;
            max-width: 820px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .page-header-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px 16px;
        }

        .page-body h2 {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: clamp(1.6rem, 2.9vw, 2.1rem);
            font-weight: 400;
            letter-spacing: -0.02em;
            line-height: 1.15;
            color: #ffffff;
        }

        .survey-bar-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid rgba(255, 255, 255, 0.24);
            color: #ffffff;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 1.02rem;
            font-weight: 500;
            padding: 14px 18px;
            border-radius: 14px;
            cursor: pointer;
            text-align: left;
            transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        .survey-bar-btn:hover {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.55);
            transform: translateY(-1px);
        }

        .survey-bar-sub {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 0.92rem;
            font-weight: 400;
            color: var(--text-muted);
        }

        .panel-card {
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel-head {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .panel-title {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 1.04rem;
            font-weight: 500;
            color: #ffffff;
        }

        .identity-badge {
            display: none;
            align-items: center;
            gap: 6px;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--accent-ok);
            background: rgba(154, 230, 180, 0.12);
            border: 1px solid rgba(154, 230, 180, 0.32);
            padding: 3px 10px;
            border-radius: 999px;
        }

        .identity-badge.is-visible {
            display: inline-flex;
        }

        .form-label {
            display: block;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 0.94rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 6px;
        }

        .form-textarea {
            width: 100%;
            min-height: 150px;
            resize: vertical;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.24);
            background: rgba(12, 12, 14, 0.55);
            color: #ffffff;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 1.00rem;
            font-weight: 400;
            line-height: 1.55;
            padding: 11px 13px;
            outline: none;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .form-textarea:focus {
            border-color: rgba(255, 255, 255, 0.65);
            background: rgba(12, 12, 14, 0.72);
        }

        .form-input {
            width: 100%;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.24);
            background: rgba(12, 12, 14, 0.55);
            color: #ffffff;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 0.96rem;
            font-weight: 400;
            padding: 9px 12px;
            outline: none;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .form-input:focus {
            border-color: rgba(255, 255, 255, 0.65);
            background: rgba(12, 12, 14, 0.72);
        }

        .field-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--text-muted);
        }

        .char-counter.is-near {
            color: #fbd38d;
        }

        .char-counter.is-max {
            color: #feb2b2;
            font-weight: 500;
        }

        .form-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 4px;
        }

        .submit-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.45);
            color: #ffffff;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 0.96rem;
            font-weight: 500;
            padding: 9px 20px;
            border-radius: 999px;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
        }

        .submit-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.3);
            border-color: #ffffff;
        }

        .submit-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .status-msg {
            display: none;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 0.96rem;
            font-weight: 400;
            line-height: 1.5;
            padding: 10px 13px;
            border-radius: 10px;
            text-shadow: none;
        }

        .status-msg.is-visible {
            display: block;
        }

        .status-msg.is-thanks {
            background: rgba(154, 230, 180, 0.16);
            border: 1px solid rgba(154, 230, 180, 0.45);
            color: #dcfce7;
        }

        .status-msg.is-warn {
            background: rgba(251, 211, 141, 0.16);
            border: 1px solid rgba(251, 211, 141, 0.45);
            color: #fef3c7;
        }

        .status-msg.is-err {
            background: rgba(254, 178, 178, 0.16);
            border: 1px solid rgba(254, 178, 178, 0.45);
            color: #fee2e2;
        }

        .survey-modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.62);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .survey-modal-backdrop.is-visible {
            display: flex;
            opacity: 1;
        }

        .survey-modal-dialog {
            width: 100%;
            max-width: 540px;
            max-height: 88vh;
            max-height: 88dvh;
            display: flex;
            flex-direction: column;
            background: rgba(24, 24, 28, 0.95);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
            overflow: hidden;
            color: #ffffff;
            text-shadow: none;
        }

        .survey-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        .survey-modal-header h3 {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 1.05rem;
            font-weight: 500;
            color: #ffffff;
        }

        .survey-modal-close {
            width: 30px;
            height: 30px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.28);
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            font-size: 1.15rem;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .survey-modal-body {
            padding: 16px 18px 20px 18px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .survey-progress-wrap {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .survey-progress-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 0.85rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.72);
        }

        .survey-progress-track {
            width: 100%;
            height: 4px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.14);
            overflow: hidden;
        }

        .survey-progress-fill {
            height: 100%;
            width: 20%;
            border-radius: 999px;
            background: var(--accent-ok);
            transition: width 0.25s ease;
        }

        .survey-single-card {
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.04);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            touch-action: pan-y;
        }

        .survey-question-title {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 1.05rem;
            font-weight: 500;
            line-height: 1.45;
            color: #ffffff;
        }

        .survey-options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .survey-option-btn {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 10px;
            padding: 10px 12px;
            color: rgba(255, 255, 255, 0.92);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 0.96rem;
            font-weight: 400;
            line-height: 1.4;
            cursor: pointer;
            transition: background-color 0.18s ease, border-color 0.18s ease;
        }

        .survey-option-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.42);
        }

        .survey-option-btn.is-selected {
            background: rgba(154, 230, 180, 0.18);
            border-color: rgba(154, 230, 180, 0.75);
            color: #ffffff;
            font-weight: 500;
        }

        /* 选项左侧圆圈单选框 */
        .survey-radio-circle {
            flex-shrink: 0;
            width: 18px;
            height: 18px;
            border-radius: 999px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.18s ease, background-color 0.18s ease;
        }

        .survey-option-btn.is-selected .survey-radio-circle {
            border-color: var(--accent-ok);
            background: var(--accent-ok);
        }

        .survey-option-btn.is-selected .survey-radio-circle::after {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 999px;
            background: #141418;
        }

        .survey-nav-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 2px;
        }

        .survey-nav-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.28);
            color: #ffffff;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 0.94rem;
            font-weight: 400;
            padding: 9px 16px;
            border-radius: 999px;
            cursor: pointer;
            transition: background-color 0.18s ease, border-color 0.18s ease, opacity 0.18s ease;
        }

        .survey-nav-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.18);
            border-color: #ffffff;
        }

        .survey-nav-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .page-footer {
            max-width: 820px;
            width: 100%;
            margin: 6px auto 0 auto;
            padding-top: 8px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 8px 16px;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 0.82rem;
            font-weight: 400;
            color: var(--text-muted);
        }

        .footer-contact a {
            color: #ffffff;
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.35);
            padding-bottom: 1px;
        }

        .footer-meta {
            text-align: right;
            line-height: 1.4;
        }

        @media (max-width: 768px) {
            .footer-meta {
                text-align: left;
            }
        }
    </style>
</head>
<body>

    <div class="bg-wrapper">
        <div class="parallax-bg"></div>
    </div>

    <div class="standalone-container">
        <div class="page-top">
            <a href="https://air2aim.com/" class="page-brand-sm" title="AIR²Aim">AIR²Aim</a>

            <div class="top-controls">
                <div class="lang-dropdown" id="langDropdown">
                    <button type="button" class="lang-globe-btn" id="langGlobeBtn" aria-expanded="false" aria-label="Switch language">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M2 12h20"></path>
                            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                        </svg>
                        <span id="currentLangCode">EN</span>
                    </button>
                    <div class="lang-menu" id="langMenu" role="menu">
                        <button type="button" class="lang-option" data-lang="zh"><span>中文</span><span>ZH</span></button>
                        <button type="button" class="lang-option active" data-lang="en"><span>English</span><span>EN</span></button>
                        <button type="button" class="lang-option" data-lang="ru"><span>Русский</span><span>RU</span></button>
                        <button type="button" class="lang-option" data-lang="fr"><span>Français</span><span>FR</span></button>
                        <button type="button" class="lang-option" data-lang="es"><span>Español</span><span>ES</span></button>
                    </div>
                </div>

                <button type="button" class="tts-toggle-btn active" id="ttsToggle" aria-label="Toggle voice reading">
                    <svg class="icon-sound" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                    </svg>
                    <svg class="icon-mute" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <line x1="23" y1="9" x2="17" y2="15"></line>
                        <line x1="17" y1="9" x2="23" y2="15"></line>
                    </svg>
                    <span id="ttsLabel">on</span>
                </button>
            </div>
        </div>

        <div class="page-body">
            <div class="page-header-row">
                <h2 id="pageTitle">Feedback</h2>
            </div>

                const params = new URLSearchParams(window.location.search);
                const queryLang = (params.get('lang') || '').toLowerCase().split('-')[0];
                if (queryLang && Object.prototype.hasOwnProperty.call(I18N, queryLang)) {
                    return queryLang;
                }

                const systemLangs = Array.isArray(navigator.languages) && navigator.languages.length > 0
                    ? navigator.languages
                    : [navigator.language || navigator.userLanguage || 'en'];

                for (let i = 0; i < systemLangs.length; i++) {
                    const code = String(systemLangs[i] || '').toLowerCase().trim();
                    const base = code.split('-')[0];
                    if (Object.prototype.hasOwnProperty.call(I18N, base)) {
                        return base;
                    }
                }
                return 'en';
            }

            function stopSpeaking() {
                speechSessionId += 1;
                activeUtterances.length = 0;
                if (supportsTTS) {
                    window.speechSynthesis.cancel();
                }
            }

            function speakText(text) {
                if (!supportsTTS || !isTtsEnabled || !text) return;
                stopSpeaking();
                const sessionId = speechSessionId;
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = I18N[activeLang]?.ttsLang || 'en-US';
                utterance.rate = 0.95;
                utterance.onstart = function () {
                    if (sessionId !== speechSessionId) {
                        window.speechSynthesis.cancel();
                    }
                };
                activeUtterances.push(utterance);
                window.speechSynthesis.speak(utterance);
            }

            function updateToggleUI() {
                if (!supportsTTS) {
                    ttsLabel.textContent = 'off';
                    ttsToggle.classList.remove('active');
                    return;
                }
                ttsLabel.textContent = isTtsEnabled ? 'on' : 'off';
                ttsToggle.classList.toggle('active', isTtsEnabled);
            }

            function updateCharCounter() {
                const len = feedbackText.value.length;
                charCounter.textContent = len + ' / ' + MAX_CHARS;
                charCounter.classList.toggle('is-near', len >= 850 && len < MAX_CHARS);
                charCounter.classList.toggle('is-max', len >= MAX_CHARS);
            }

            function renderIdentity(pack) {
                if (fragmentCtx.email) {
                    identityBadge.textContent = pack.accountPrefix + fragmentCtx.email;
                    identityBadge.classList.add('is-visible');
                    if (!contactEmail.value) {
                        contactEmail.value = fragmentCtx.email;
                    }
                } else if (fragmentCtx.uid) {
                    identityBadge.textContent = pack.uidPrefix + fragmentCtx.uid;
                    identityBadge.classList.add('is-visible');
                } else {
                    identityBadge.textContent = '';
                    identityBadge.classList.remove('is-visible');
                }
            }

            function renderCurrentQuestion() {
                const pack = I18N[activeLang] || I18N.en;
                const questions = SURVEY_QUESTIONS[activeLang] || SURVEY_QUESTIONS.en;
                const total = questions.length;
                if (currentQuestionIndex < 0) currentQuestionIndex = 0;
                if (currentQuestionIndex >= total) currentQuestionIndex = total - 1;

                const item = questions[currentQuestionIndex];
                surveyStepText.textContent = pack.surveyStepPrefix + (currentQuestionIndex + 1) + pack.surveyStepSuffix;
                surveySwipeHint.textContent = pack.surveySwipeHint;
                surveyProgressFill.style.width = (((currentQuestionIndex + 1) / total) * 100) + '%';

                surveySingleCard.innerHTML = '';

                const title = document.createElement('div');
                title.className = 'survey-question-title';
                title.textContent = item.q;
                surveySingleCard.appendChild(title);

                const optList = document.createElement('div');
                optList.className = 'survey-options-list';

                ['A', 'B', 'C'].forEach(function (optKey) {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'survey-option-btn';
                    if (selectedSurveyAnswers[item.id] === optKey) {
                        btn.classList.add('is-selected');
                    }

                    const circle = document.createElement('span');
                    circle.className = 'survey-radio-circle';
                    circle.setAttribute('aria-hidden', 'true');

                    const textSpan = document.createElement('span');
                    textSpan.textContent = item.options[optKey];

                    btn.appendChild(circle);
                    btn.appendChild(textSpan);

                    btn.addEventListener('click', function () {
                        selectedSurveyAnswers[item.id] = optKey;
                        optList.querySelectorAll('.survey-option-btn').forEach(function (b) {
                            b.classList.remove('is-selected');
                        });
                        btn.classList.add('is-selected');
                    });

                    optList.appendChild(btn);
                });

                surveySingleCard.appendChild(optList);

                prevQuestionBtn.textContent = pack.prevBtn;
                nextQuestionBtn.textContent = pack.nextBtn;
                prevQuestionBtn.disabled = currentQuestionIndex === 0;

                const isLast = currentQuestionIndex === total - 1;
                nextQuestionBtn.style.display = isLast ? 'none' : 'inline-block';
                submitSurveyBtn.style.display = isLast ? 'inline-block' : 'none';
            }

            function renderLanguage(langKey) {
                const pack = I18N[langKey] || I18N.en;
                activeLang = Object.prototype.hasOwnProperty.call(I18N, langKey) ? langKey : 'en';
                stopSpeaking();

                document.documentElement.lang = pack.htmlLang;
                document.title = pack.docTitle;
                pageTitle.textContent = pack.heading;
                surveyBtnText.textContent = pack.surveyBtn;
                surveyBarSub.textContent = pack.surveyBarSub;
                freeFeedbackTitle.textContent = pack.freeTitle;
                feedbackTextLabel.textContent = pack.textLabel;
                feedbackText.placeholder = pack.textPlaceholder;
                feedbackHint.textContent = pack.textHint;
                contactEmailLabel.textContent = pack.emailLabel;
                contactEmail.placeholder = pack.emailPlaceholder;
                submitFeedbackBtn.textContent = isSubmitting ? pack.submittingBtn : pack.submitBtn;

                surveyModalTitle.textContent = pack.surveyTitle;
                submitSurveyBtn.textContent = isSurveySubmitting ? pack.submittingBtn : pack.surveySubmit;

                supportPrefix.textContent = pack.supportPrefix;
                footerBadge.textContent = pack.footerBadge;
                currentLangCode.textContent = pack.label;

                langOptions.forEach(function (opt) {
                    opt.classList.toggle('active', opt.getAttribute('data-lang') === activeLang);
                });

                renderIdentity(pack);
                renderCurrentQuestion();
            }

            function showStatus(el, msg, typeClass) {
                el.textContent = msg;
                el.className = 'status-msg is-visible ' + typeClass;
            }

            async function insertToSupabase(payload) {
                const res = await fetch(FEEDBACK_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_KEY,
                        'Authorization': 'Bearer ' + SUPABASE_KEY,
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) {
                    const errText = await res.text().catch(function () { return ''; });
                    throw new Error('HTTP ' + res.status + ' ' + errText);
                }
            }

            feedbackText.addEventListener('input', function () {
                if (feedbackText.value.length > MAX_CHARS) {
                    feedbackText.value = feedbackText.value.slice(0, MAX_CHARS);
                }
                updateCharCounter();
            });

            feedbackForm.addEventListener('submit', async function (e) {
                e.preventDefault();
                if (isSubmitting) return;

                const pack = I18N[activeLang] || I18N.en;
                const content = feedbackText.value.trim();
                if (!content) {
                    showStatus(feedbackStatus, pack.emptyWarn, 'is-warn');
                    feedbackText.focus();
                    return;
                }

                const emailVal = contactEmail.value.trim() || fragmentCtx.email || null;
                const payload = {
                    feedback_type: 'free_text',
                    content: content,
                    contact_email: emailVal,
                    uid: fragmentCtx.uid || null,
                    lang: fragmentCtx.lang || activeLang,
                    app_version: fragmentCtx.version || null,
                    platform: fragmentCtx.platform || 'web',
                    os_version: fragmentCtx.os_version || null,
                    sdk: fragmentCtx.sdk || null,
                    brand: fragmentCtx.brand || null,
                    manufacturer: fragmentCtx.manufacturer || null,
                    model: fragmentCtx.model || null,
                    page_url: window.location.pathname
                };

                isSubmitting = true;
                submitFeedbackBtn.disabled = true;
                submitFeedbackBtn.textContent = pack.submittingBtn;
                feedbackStatus.className = 'status-msg';

                try {
                    await insertToSupabase(payload);
                    feedbackText.value = '';
                    updateCharCounter();
                    showStatus(feedbackStatus, pack.thanksMsg, 'is-thanks');
                    speakText(pack.thanksMsg);
                } catch (err) {
                    console.error('Feedback submit failed:', err);
                    showStatus(feedbackStatus, pack.errorMsg, 'is-err');
                } finally {
                    isSubmitting = false;
                    submitFeedbackBtn.disabled = false;
                    const currentPack = I18N[activeLang] || I18N.en;
                    submitFeedbackBtn.textContent = currentPack.submitBtn;
                }
            });

            function openSurveyModal() {
                surveyStatus.className = 'status-msg';
                surveyStatus.textContent = '';
                currentQuestionIndex = 0;
                renderCurrentQuestion();
                surveyModalBackdrop.classList.add('is-visible');
                document.body.style.overflow = 'hidden';
            }

            function closeSurveyModal() {
                surveyModalBackdrop.classList.remove('is-visible');
                document.body.style.overflow = '';
            }

            prevQuestionBtn.addEventListener('click', function () {
                if (currentQuestionIndex > 0) {
                    currentQuestionIndex -= 1;
                    surveyStatus.className = 'status-msg';
                    renderCurrentQuestion();
                }
            });

            nextQuestionBtn.addEventListener('click', function () {
                const questions = SURVEY_QUESTIONS[activeLang] || SURVEY_QUESTIONS.en;
                if (currentQuestionIndex < questions.length - 1) {
                    currentQuestionIndex += 1;
                    surveyStatus.className = 'status-msg';
                    renderCurrentQuestion();
                }
            });

            // 触摸左右滑动切题
            let touchStartX = 0;
            let touchStartY = 0;
            surveySingleCard.addEventListener('touchstart', function (e) {
                if (!e.touches || e.touches.length === 0) return;
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }, { passive: true });

            surveySingleCard.addEventListener('touchend', function (e) {
                if (!e.changedTouches || e.changedTouches.length === 0) return;
                const dx = e.changedTouches[0].clientX - touchStartX;
                const dy = e.changedTouches[0].clientY - touchStartY;
                if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.2) {
                    if (dx < 0) {
                        nextQuestionBtn.click();
                    } else {
                        prevQuestionBtn.click();
                    }
                }
            }, { passive: true });

            openSurveyBtn.addEventListener('click', openSurveyModal);
            surveyModalClose.addEventListener('click', closeSurveyModal);
            surveyModalBackdrop.addEventListener('click', function (e) {
                if (e.target === surveyModalBackdrop) {
                    closeSurveyModal();
                }
            });

            submitSurveyBtn.addEventListener('click', async function () {
                if (isSurveySubmitting) return;
                const pack = I18N[activeLang] || I18N.en;
                const questions = SURVEY_QUESTIONS[activeLang] || SURVEY_QUESTIONS.en;

                const firstUnansweredIndex = questions.findIndex(function (item) {
                    return !selectedSurveyAnswers[item.id];
                });

                if (firstUnansweredIndex !== -1) {
                    currentQuestionIndex = firstUnansweredIndex;
                    renderCurrentQuestion();
                    showStatus(surveyStatus, pack.surveyIncompleteWarn, 'is-warn');
                    return;
                }

                const summaryLines = questions.map(function (item) {
                    const chosenKey = selectedSurveyAnswers[item.id];
                    return item.q + ' -> ' + item.options[chosenKey];
                });

                const emailVal = contactEmail.value.trim() || fragmentCtx.email || null;
                const payload = {
                    feedback_type: 'survey',
                    content: summaryLines.join('\n'),
                    survey_answers: {
                        q1: selectedSurveyAnswers.q1,
                        q2: selectedSurveyAnswers.q2,
                        q3: selectedSurveyAnswers.q3,
                        q4: selectedSurveyAnswers.q4,
                        q5: selectedSurveyAnswers.q5,
                        ui_lang: activeLang
                    },
                    contact_email: emailVal,
                    uid: fragmentCtx.uid || null,
                    lang: fragmentCtx.lang || activeLang,
                    app_version: fragmentCtx.version || null,
                    platform: fragmentCtx.platform || 'web',
                    os_version: fragmentCtx.os_version || null,
                    sdk: fragmentCtx.sdk || null,
                    brand: fragmentCtx.brand || null,
                    manufacturer: fragmentCtx.manufacturer || null,
                    model: fragmentCtx.model || null,
                    page_url: window.location.pathname
                };

                isSurveySubmitting = true;
                submitSurveyBtn.disabled = true;
                submitSurveyBtn.textContent = pack.submittingBtn;
                surveyStatus.className = 'status-msg';

                try {
                    await insertToSupabase(payload);
                    showStatus(surveyStatus, pack.surveyThanks, 'is-thanks');
                    speakText(pack.surveyThanks);
                } catch (err) {
                    console.error('Survey submit failed:', err);
                    showStatus(surveyStatus, pack.errorMsg, 'is-err');
                } finally {
                    isSurveySubmitting = false;
                    submitSurveyBtn.disabled = false;
                    const currentPack = I18N[activeLang] || I18N.en;
                    submitSurveyBtn.textContent = currentPack.surveySubmit;
                }
            });

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && surveyModalBackdrop.classList.contains('is-visible')) {
                    closeSurveyModal();
                }
            });

            langGlobeBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                const willOpen = !langDropdown.classList.contains('open');
                langDropdown.classList.toggle('open', willOpen);
                langGlobeBtn.setAttribute('aria-expanded', String(willOpen));
            });

            langOptions.forEach(function (opt) {
                opt.addEventListener('click', function (e) {
                    e.stopPropagation();
                    const chosen = opt.getAttribute('data-lang');
                    langDropdown.classList.remove('open');
                    langGlobeBtn.setAttribute('aria-expanded', 'false');
                    renderLanguage(chosen);
                });
            });

            document.addEventListener('click', function (e) {
                if (!langDropdown.contains(e.target)) {
                    langDropdown.classList.remove('open');
                    langGlobeBtn.setAttribute('aria-expanded', 'false');
                }
            });

            ttsToggle.addEventListener('click', function () {
                if (!supportsTTS) return;
                isTtsEnabled = !isTtsEnabled;
                updateToggleUI();
                if (!isTtsEnabled) {
                    stopSpeaking();
                }
            });

            window.addEventListener('pagehide', stopSpeaking);
            window.addEventListener('beforeunload', stopSpeaking);
            document.addEventListener('visibilitychange', function () {
                if (document.hidden) {
                    stopSpeaking();
                }
            });

            updateToggleUI();
            updateCharCounter();
            renderLanguage(detectInitialLanguage());
        })();
    </script>
<script src="docs-nav.js"></script>
</body>
