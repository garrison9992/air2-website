<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>User Guide — AIR²Aim</title>
    <style>
        :root {
            --text-primary: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.72);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            color: var(--text-primary);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-weight: 400;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .bg-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #111111;
            z-index: -1;
        }

        .parallax-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-image: url('../bg1.jpg');
            transform: scale(1.05);
            animation: bgInitialZoom 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @media (max-width: 768px) {
            .parallax-bg {
                background-image: url('../bg2.jpg');
            }
        }

        @keyframes bgInitialZoom {
            0% {
                opacity: 0;
                transform: scale(1.12);
            }
            30% {
                opacity: 0.5;
            }
            100% {
                opacity: 1;
                transform: scale(1.05);
            }
        }

        @keyframes contentFadeIn {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .standalone-container {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 48px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            animation: contentFadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards;
            opacity: 0;
        }

        @media (max-width: 768px) {
            .standalone-container {
                padding: 18px 18px 24px 18px;
            }
        }

        .page-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
        }

        .page-brand-sm {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            word-spacing: -0.15em;
            color: #ffffff;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        .page-brand-sm:hover {
            opacity: 0.85;
        }

        .top-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lang-dropdown {
            position: relative;
        }

        .lang-globe-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #ffffff;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 0.82rem;
            font-weight: 400;
            letter-spacing: 0.04em;
            padding: 5px 11px;
            border-radius: 999px;
            cursor: pointer;
            transition: border-color 0.25s ease, background-color 0.25s ease;
        }

        .lang-globe-btn:hover,
        .lang-dropdown.open .lang-globe-btn {
            background: rgba(255, 255, 255, 0.16);
            border-color: #ffffff;
        }

        .lang-menu {
            display: none;
            position: absolute;
            right: 0;
            top: calc(100% + 6px);
            min-width: 128px;
            background: rgba(20, 20, 22, 0.94);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            padding: 4px;
            z-index: 30;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        }

        .lang-dropdown.open .lang-menu {
            display: block;
        }

        .lang-option {
            width: 100%;
            background: transparent;
            border: none;
            color: #ffffff;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 0.92rem;
            font-weight: 400;
            text-align: left;
            padding: 7px 10px;
            border-radius: 7px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s ease;
        }

        .lang-option:hover {
            background: rgba(255, 255, 255, 0.14);
        }

        .lang-option.active {
            background: rgba(255, 255, 255, 0.2);
            font-weight: 500;
        }

        .tts-toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #ffffff;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 0.82rem;
            font-weight: 400;
            letter-spacing: 0.04em;
            padding: 5px 11px;
            border-radius: 999px;
            cursor: pointer;
            transition: opacity 0.25s ease, border-color 0.25s ease, background-color 0.25s ease;
        }

        .tts-toggle-btn.active {
            background: rgba(255, 255, 255, 0.16);
            border-color: #ffffff;
            opacity: 1;
        }

        .tts-toggle-btn:not(.active) {
            opacity: 0.65;
        }

        .tts-toggle-btn .icon-mute {
            display: none;
        }

        .tts-toggle-btn:not(.active) .icon-sound {
            display: none;
        }

        .tts-toggle-btn:not(.active) .icon-mute {
            display: inline-block;
        }

        .page-body {
            margin: 14px auto;
            max-width: 820px;
            width: 100%;
        }

        .page-header-row {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px 16px;
            margin-bottom: 12px;
        }

        .page-body h2 {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: clamp(1.6rem, 2.9vw, 2.1rem);
            font-weight: 400;
            letter-spacing: -0.02em;
            line-height: 1.15;
            color: #ffffff;
        }

        .page-lead {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 0.96rem;
            font-weight: 400;
            line-height: 1.45;
            color: var(--text-muted);
        }

        .accordion-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .info-details {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 10px;
            overflow: hidden;
            transition: border-color 0.28s ease, background-color 0.28s ease;
        }

        .info-details:hover {
            border-color: rgba(255, 255, 255, 0.34);
        }

        .info-details.is-open {
            border-color: rgba(255, 255, 255, 0.42);
            background: rgba(0, 0, 0, 0.36);
        }

        .info-summary {
            padding: 9px 14px;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 1.02rem;
            font-weight: 500;
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .info-summary::after {
            content: "+";
            font-size: 1.15rem;
            font-weight: 300;
            line-height: 1;
            transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
            margin-left: 12px;
            flex-shrink: 0;
        }

        .info-details.is-open .info-summary::after {
            transform: rotate(45deg);
        }

        .info-summary::-webkit-details-marker {
            display: none;
        }

        .info-collapse {
            display: grid;
            grid-template-rows: 0fr;
            opacity: 0;
            transition: grid-template-rows 0.36s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.28s ease;
        }

        .info-details.is-open .info-collapse {
            grid-template-rows: 1fr;
            opacity: 1;
        }

        .info-collapse-inner {
            overflow: hidden;
        }

        .info-content {
            padding: 9px 14px 12px 14px;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 0.98rem;
            font-weight: 400;
            line-height: 1.55;
            color: rgba(255, 255, 255, 0.9);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
        }

        .info-content p {
            margin-bottom: 5px;
        }

        .info-content p:last-child {
            margin-bottom: 0;
        }

        .page-footer {
            max-width: 820px;
            width: 100%;
            margin: 6px auto 0 auto;
            padding-top: 8px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 8px 16px;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 0.82rem;
            font-weight: 400;
            color: var(--text-muted);
        }

        .footer-contact a {
            color: #ffffff;
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.35);
            padding-bottom: 1px;
        }

        .footer-meta {
            text-align: right;
            line-height: 1.4;
        }

        @media (max-width: 768px) {
            .footer-meta {
                text-align: left;
            }
        }

        .repeat-modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.62);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .repeat-modal-backdrop.is-visible {
            display: flex;
            opacity: 1;
        }

        .repeat-modal-dialog {
            width: 100%;
            max-width: 760px;
            max-height: 86vh;
            max-height: 86dvh;
            display: flex;
            flex-direction: column;
            background: rgba(24, 24, 28, 0.88);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
            overflow: hidden;
            color: #ffffff;
            text-shadow: none;
            transform: translateY(8px) scale(0.985);
            transition: transform 0.26s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .repeat-modal-backdrop.is-visible .repeat-modal-dialog {
            transform: translateY(0) scale(1);
        }

        .repeat-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 18px 10px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        .repeat-modal-title-wrap h3 {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 1.12rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            color: #ffffff;
        }

        .repeat-modal-subtitle {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 0.84rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.68);
            margin-top: 2px;
        }

        .repeat-modal-close {
            width: 30px;
            height: 30px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.28);
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            font-size: 1.15rem;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .repeat-modal-close:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #ffffff;
        }

        .card-deck-strip {
            display: flex;
            align-items: flex-end;
            overflow-x: auto;
            padding: 12px 16px 0 16px;
            background: rgba(0, 0, 0, 0.24);
            border-bottom: 1px solid rgba(255, 255, 255, 0.16);
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.25) transparent;
        }

        .card-deck-strip::-webkit-scrollbar {
            height: 4px;
        }

        .card-deck-strip::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 999px;
        }

        .deck-tab-card {
            position: relative;
            flex: 0 0 auto;
            min-width: 96px;
            max-width: 142px;
            padding: 8px 12px 9px 12px;
            margin-right: -8px;
            border-radius: 10px 10px 0 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom: none;
            background: rgba(42, 42, 48, 0.88);
            color: rgba(255, 255, 255, 0.72);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            text-align: left;
            cursor: pointer;
            box-shadow: -3px 0 10px rgba(0, 0, 0, 0.35);
            transform: translateY(3px);
            transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1),
                        background-color 0.22s ease,
                        color 0.22s ease,
                        border-color 0.22s ease,
                        box-shadow 0.22s ease;
        }

        .deck-tab-card:last-child {
            margin-right: 0;
        }

        .deck-tab-card:hover {
            transform: translateY(1px);
            color: #ffffff;
            background: rgba(58, 58, 66, 0.94);
        }

        .deck-tab-card.is-active {
            z-index: 12 !important;
            transform: translateY(0);
            background: rgba(82, 82, 92, 0.96);
            border-color: rgba(255, 255, 255, 0.52);
            color: #ffffff;
            box-shadow: 0 -2px 14px rgba(0, 0, 0, 0.45), 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        .deck-tab-code {
            display: block;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.58);
            margin-bottom: 2px;
        }

        .deck-tab-card.is-active .deck-tab-code {
            color: #9ae6b4;
        }

        .deck-tab-name {
            display: block;
            font-size: 0.86rem;
            font-weight: 400;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .deck-tab-card.is-active .deck-tab-name {
            font-weight: 500;
        }

        .active-card-stage {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 18px 20px 20px 20px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            cursor: pointer;
        }

        .stage-card-head {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
        }

        .stage-card-title {
            font-size: 1.12rem;
            font-weight: 500;
            color: #ffffff;
        }

        .stage-card-pill {
            font-size: 0.78rem;
            font-weight: 400;
            padding: 2px 9px;
            border-radius: 999px;
            background: rgba(154, 230, 180, 0.16);
            border: 1px solid rgba(154, 230, 180, 0.38);
            color: #c6f6d5;
        }

        .stage-desc {
            font-size: 0.96rem;
            font-weight: 400;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.92);
            margin-bottom: 10px;
        }

        .stage-example-box {
            border-left: 3px solid rgba(154, 230, 180, 0.7);
            background: rgba(255, 255, 255, 0.06);
            border-radius: 0 8px 8px 0;
            padding: 9px 13px;
            margin: 10px 0;
            font-size: 0.94rem;
            font-weight: 400;
            line-height: 1.55;
            color: rgba(255, 255, 255, 0.94);
        }

        .stage-table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 0.9rem;
            border-radius: 8px;
            overflow: hidden;
        }

        .stage-table th,
        .stage-table td {
            padding: 7px 10px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            vertical-align: top;
        }

        .stage-table th {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
        }

        .stage-table tr:last-child td {
            border-bottom: none;
        }

        .stage-skip {
            color: rgba(255, 255, 255, 0.45);
        }

        .stage-week-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 5px;
            margin: 12px 0;
        }

        .stage-day {
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.48);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 2px;
            gap: 4px;
            font-size: 0.8rem;
            font-weight: 400;
        }

        .stage-day.on {
            background: rgba(154, 230, 180, 0.15);
            border-color: rgba(154, 230, 180, 0.42);
            color: #c6f6d5;
            font-weight: 500;
        }

        .stage-months-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            margin: 12px 0;
        }

        .stage-month {
            border-radius: 9px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.14);
            text-align: center;
            padding: 9px 6px;
        }

        .stage-month-label {
            display: block;
            font-size: 0.78rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.65);
        }

        .stage-month-day {
            display: block;
            font-size: 1.4rem;
            font-weight: 500;
            color: #9ae6b4;
            line-height: 1.25;
            margin: 2px 0;
        }

        .stage-month-time {
            display: block;
            font-size: 0.8rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.82);
        }

        .stage-note {
            font-size: 0.88rem;
            font-weight: 400;
            line-height: 1.55;
            color: rgba(255, 255, 255, 0.74);
            margin-top: 8px;
        }

        .repeat-modal-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 9px 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(0, 0, 0, 0.25);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 0.82rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.68);
        }

        .deck-nav-btns {
            display: flex;
            gap: 6px;
        }

        .deck-nav-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.24);
            color: #ffffff;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 0.82rem;
            font-weight: 400;
            padding: 4px 10px;
            border-radius: 999px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .deck-nav-btn:hover {
            background: rgba(255, 255, 255, 0.22);
        }

        @media (max-width: 600px) {
            .repeat-modal-dialog {
                max-height: 90dvh;
            }
            .deck-tab-card {
                min-width: 84px;
                padding: 7px 10px 8px 10px;
            }
            .active-card-stage {
                padding: 14px 14px 16px 14px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-wrapper">
        <div class="parallax-bg"></div>
    </div>

    <div class="standalone-container">
        <div class="page-top">
            <a href="https://air2aim.com/" class="page-brand-sm" title="AIR²Aim">AIR²Aim</a>

            <div class="top-controls">
                <div class="lang-dropdown" id="langDropdown">
                    <button type="button" class="lang-globe-btn" id="langGlobeBtn" aria-expanded="false" aria-label="Switch language">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M2 12h20"></path>
                            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                        </svg>
                        <span id="currentLangCode">EN</span>
                    </button>
                    <div class="lang-menu" id="langMenu" role="menu">
                        <button type="button" class="lang-option" data-lang="zh"><span>中文</span><span>ZH</span></button>
                        <button type="button" class="lang-option active" data-lang="en"><span>English</span><span>EN</span></button>
                        <button type="button" class="lang-option" data-lang="ru"><span>Русский</span><span>RU</span></button>
                        <button type="button" class="lang-option" data-lang="fr"><span>Français</span><span>FR</span></button>
                        <button type="button" class="lang-option" data-lang="es"><span>Español</span><span>ES</span></button>
                    </div>

            };

            const accordionSection = document.getElementById('accordionSection');
            const pageTitle = document.getElementById('pageTitle');
            const pageLead = document.getElementById('pageLead');
            const supportPrefix = document.getElementById('supportPrefix');
            const footerBadge = document.getElementById('footerBadge');
            const currentLangCode = document.getElementById('currentLangCode');
            const langDropdown = document.getElementById('langDropdown');
            const langGlobeBtn = document.getElementById('langGlobeBtn');
            const langOptions = document.querySelectorAll('.lang-option');
            const ttsToggle = document.getElementById('ttsToggle');
            const ttsLabel = document.getElementById('ttsLabel');

            const repeatModalBackdrop = document.getElementById('repeatModalBackdrop');
            const repeatModalTitle = document.getElementById('repeatModalTitle');
            const repeatModalSubtitle = document.getElementById('repeatModalSubtitle');
            const repeatModalClose = document.getElementById('repeatModalClose');
            const cardDeckStrip = document.getElementById('cardDeckStrip');
            const activeCardStage = document.getElementById('activeCardStage');
            const deckCounter = document.getElementById('deckCounter');
            const deckPrevBtn = document.getElementById('deckPrevBtn');
            const deckNextBtn = document.getElementById('deckNextBtn');

            const supportsTTS = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
            let isTtsEnabled = supportsTTS;
            let activeLang = 'en';
            let activeDeckIndex = 0;
            let speechSessionId = 0;
            const activeUtterances = [];

            function detectInitialLanguage() {
                const params = new URLSearchParams(window.location.search);
                const queryLang = (params.get('lang') || '').toLowerCase().split('-')[0];
                if (queryLang && Object.prototype.hasOwnProperty.call(I18N, queryLang)) {
                    return queryLang;
                }

                const systemLangs = Array.isArray(navigator.languages) && navigator.languages.length > 0
                    ? navigator.languages
                    : [navigator.language || navigator.userLanguage || 'en'];

                for (let i = 0; i < systemLangs.length; i++) {
                    const code = String(systemLangs[i] || '').toLowerCase().trim();
                    const base = code.split('-')[0];
                    if (Object.prototype.hasOwnProperty.call(I18N, base)) {
                        return base;
                    }
                }
                return 'en';
            }

            function stopSpeaking() {
                speechSessionId += 1;
                activeUtterances.length = 0;
                if (supportsTTS) {
                    window.speechSynthesis.cancel();
                }
            }

            function normalizeSpeechText(rawText) {
                return String(rawText || '')
                    .replace(/AIR²Aim/gi, 'Air 2 Aim')
                    .replace(/•/g, '，')
                    .replace(/\s+/g, ' ')
                    .trim();
            }

            function getCardSpeechText(cardEl) {
                const summaryEl = cardEl.querySelector('.info-summary');
                const contentEl = cardEl.querySelector('.info-content');
                const summaryText = summaryEl ? summaryEl.textContent : '';
                const paragraphTexts = contentEl
                    ? Array.from(contentEl.querySelectorAll('p')).map(function (p) {
                        return p.textContent || '';
                    })
                    : [];
                return normalizeSpeechText([summaryText].concat(paragraphTexts).join('。'));
            }

            function splitIntoChunks(text) {
                const cleaned = normalizeSpeechText(text);
                if (!cleaned) return [];
                const parts = cleaned.match(/[^。！？；.!?;]+(?:[。！？；.!?;]+|$)/g);
                return parts ? parts.map(function (s) { return s.trim(); }).filter(Boolean) : [cleaned];
            }

            function speakText(text) {
                if (!supportsTTS || !isTtsEnabled || !text) return;

                stopSpeaking();
                const sessionId = speechSessionId;
                const chunks = splitIntoChunks(text);
                if (!chunks.length) return;

                if (window.speechSynthesis.paused) {
                    window.speechSynthesis.resume();
                }

                chunks.forEach(function (chunk) {
                    const utterance = new SpeechSynthesisUtterance(chunk);
                    utterance.lang = I18N[activeLang]?.ttsLang || 'en-US';
                    utterance.rate = 0.95;
                    utterance.onstart = function () {
                        if (sessionId !== speechSessionId) {
                            window.speechSynthesis.cancel();
                        }
                    };
                    activeUtterances.push(utterance);
                    window.speechSynthesis.speak(utterance);
                });
            }

            function updateToggleUI() {
                if (!supportsTTS) {
                    ttsLabel.textContent = 'off';
                    ttsToggle.classList.remove('active');
                    return;
                }
                ttsLabel.textContent = isTtsEnabled ? 'on' : 'off';
                ttsToggle.classList.toggle('active', isTtsEnabled);
            }

            function setCardOpen(cardEl, shouldOpen) {
                const detailEl = cardEl.querySelector('details');
                if (!detailEl) return;
                if (shouldOpen) {
                    detailEl.open = true;
                    cardEl.classList.add('is-open');
                } else {
                    cardEl.classList.remove('is-open');
                    detailEl.open = false;
                }
            }

            function renderDeckCard(index, shouldSpeak) {
                const pack = I18N[activeLang] || I18N.en;
                const modalData = pack.repeatModal;
                const cards = modalData.cards;
                const total = cards.length;
                activeDeckIndex = ((index % total) + total) % total;

                repeatModalTitle.textContent = modalData.title;
                repeatModalSubtitle.textContent = modalData.subtitle;
                deckPrevBtn.textContent = '← ' + modalData.prevLabel;
                deckNextBtn.textContent = modalData.nextLabel + ' →';
                deckCounter.textContent = (activeDeckIndex + 1) + ' / ' + total;

                cardDeckStrip.innerHTML = '';
                cards.forEach(function (c, idx) {
                    const tab = document.createElement('button');
                    tab.type = 'button';
                    tab.className = 'deck-tab-card' + (idx === activeDeckIndex ? ' is-active' : '');
                    tab.setAttribute('role', 'tab');
                    tab.setAttribute('aria-selected', String(idx === activeDeckIndex));
                    const dist = Math.abs(idx - activeDeckIndex);
                    tab.style.zIndex = idx === activeDeckIndex ? '12' : String(Math.max(1, 10 - dist));

                    tab.innerHTML =
                        '<span class="deck-tab-code">' + c.code + '</span>' +
                        '<span class="deck-tab-name">' + c.tabName + '</span>';

                    tab.addEventListener('click', function (e) {
                        e.stopPropagation();
                        renderDeckCard(idx, true);
                    });

                    cardDeckStrip.appendChild(tab);

                    if (idx === activeDeckIndex) {
                        requestAnimationFrame(function () {
                            tab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                        });
                    }
                });

                const activeCard = cards[activeDeckIndex];
                activeCardStage.innerHTML =
                    '<div class="stage-card-head">' +
                        '<div class="stage-card-title">' + activeCard.title + '</div>' +
                        '<span class="stage-card-pill">' + activeCard.badge + '</span>' +
                    '</div>' +
                    activeCard.html;
                activeCardStage.scrollTop = 0;

                if (shouldSpeak) {
                    speakText(activeCard.speech);
                }
            }

            function openRepeatModal() {
                const allCards = accordionSection.querySelectorAll('.info-details');
                allCards.forEach(function (other) {
                    if (other.classList.contains('is-open')) {
                        setCardOpen(other, false);
                    }
                });

                repeatModalBackdrop.classList.add('is-visible');
                document.body.style.overflow = 'hidden';
                renderDeckCard(activeDeckIndex, true);
            }

            function closeRepeatModal() {
                repeatModalBackdrop.classList.remove('is-visible');
                document.body.style.overflow = '';
                stopSpeaking();
            }

            repeatModalClose.addEventListener('click', closeRepeatModal);

            repeatModalBackdrop.addEventListener('click', function (e) {
                if (e.target === repeatModalBackdrop) {
                    closeRepeatModal();
                }
            });

            activeCardStage.addEventListener('click', function () {
                const pack = I18N[activeLang] || I18N.en;
                const activeCard = pack.repeatModal.cards[activeDeckIndex];
                if (activeCard) {
                    speakText(activeCard.speech);
                }
            });

            deckPrevBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                renderDeckCard(activeDeckIndex - 1, true);
            });

            deckNextBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                renderDeckCard(activeDeckIndex + 1, true);
            });

            document.addEventListener('keydown', function (e) {
                if (!repeatModalBackdrop.classList.contains('is-visible')) return;
                if (e.key === 'Escape') {
                    closeRepeatModal();
                } else if (e.key === 'ArrowLeft') {
                    renderDeckCard(activeDeckIndex - 1, true);
                } else if (e.key === 'ArrowRight') {
                    renderDeckCard(activeDeckIndex + 1, true);
                }
            });

            function renderLanguage(langKey) {
                const pack = I18N[langKey] || I18N.en;
                activeLang = Object.prototype.hasOwnProperty.call(I18N, langKey) ? langKey : 'en';
                stopSpeaking();

                document.documentElement.lang = pack.htmlLang;
                document.title = pack.docTitle;
                pageTitle.textContent = pack.heading;
                pageLead.textContent = pack.lead;
                supportPrefix.textContent = pack.supportPrefix;
                footerBadge.textContent = pack.footerBadge;
                currentLangCode.textContent = pack.label;

                langOptions.forEach(function (opt) {
                    opt.classList.toggle('active', opt.getAttribute('data-lang') === activeLang);
                });

                accordionSection.innerHTML = '';

                pack.items.forEach(function (item) {
                    const card = document.createElement('div');
                    card.className = 'info-details' + (item.isModalTrigger ? ' is-modal-trigger' : '');

                    if (item.isModalTrigger) {
                        const triggerRow = document.createElement('div');
                        triggerRow.className = 'info-summary';
                        triggerRow.setAttribute('role', 'button');
                        triggerRow.setAttribute('tabindex', '0');
                        triggerRow.textContent = item.summary;

                        triggerRow.addEventListener('click', openRepeatModal);
                        triggerRow.addEventListener('keydown', function (e) {
                            if (e.key === 'Enter' || e.key === ' ') {
                                e.preventDefault();
                                openRepeatModal();
                            }
                        });

                        card.appendChild(triggerRow);
                        accordionSection.appendChild(card);
                        return;
                    }

                    const detail = document.createElement('details');

                    const summary = document.createElement('summary');
                    summary.className = 'info-summary';
                    summary.textContent = item.summary;

                    const collapse = document.createElement('div');
                    collapse.className = 'info-collapse';

                    const collapseInner = document.createElement('div');
                    collapseInner.className = 'info-collapse-inner';

                    const content = document.createElement('div');
                    content.className = 'info-content';
                    item.paragraphs.forEach(function (htmlStr) {
                        const p = document.createElement('p');
                        p.innerHTML = htmlStr;
                        content.appendChild(p);
                    });

                    summary.addEventListener('click', function (e) {
                        e.preventDefault();
                        const currentlyOpen = card.classList.contains('is-open');
                        const allCards = accordionSection.querySelectorAll('.info-details');
                        allCards.forEach(function (other) {
                            if (other !== card && other.classList.contains('is-open')) {
                                setCardOpen(other, false);
                            }
                        });

                        if (!currentlyOpen) {
                            setCardOpen(card, true);
                            speakText(getCardSpeechText(card));
                        } else {
                            setCardOpen(card, false);
                            stopSpeaking();
                        }
                    });

                    content.addEventListener('click', function () {
                        speakText(getCardSpeechText(card));
                    });

                    collapseInner.appendChild(content);
                    collapse.appendChild(collapseInner);
                    detail.appendChild(summary);
                    detail.appendChild(collapse);
                    card.appendChild(detail);
                    accordionSection.appendChild(card);
                });

                if (repeatModalBackdrop.classList.contains('is-visible')) {
                    renderDeckCard(activeDeckIndex, false);
                }
            }

            langGlobeBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                const willOpen = !langDropdown.classList.contains('open');
                langDropdown.classList.toggle('open', willOpen);
                langGlobeBtn.setAttribute('aria-expanded', String(willOpen));
            });

            langOptions.forEach(function (opt) {
                opt.addEventListener('click', function (e) {
                    e.stopPropagation();
                    const chosen = opt.getAttribute('data-lang');
                    langDropdown.classList.remove('open');
                    langGlobeBtn.setAttribute('aria-expanded', 'false');
                    renderLanguage(chosen);
                });
            });

            document.addEventListener('click', function (e) {
                if (!langDropdown.contains(e.target)) {
                    langDropdown.classList.remove('open');
                    langGlobeBtn.setAttribute('aria-expanded', 'false');
                }
            });

            ttsToggle.addEventListener('click', function () {
                if (!supportsTTS) return;
                isTtsEnabled = !isTtsEnabled;
                updateToggleUI();
                if (!isTtsEnabled) {
                    stopSpeaking();
                } else if (repeatModalBackdrop.classList.contains('is-visible')) {
                    const pack = I18N[activeLang] || I18N.en;
                    const activeCard = pack.repeatModal.cards[activeDeckIndex];
                    if (activeCard) speakText(activeCard.speech);
                } else {
                    const openCard = accordionSection.querySelector('.info-details.is-open');
                    if (openCard) {
                        speakText(getCardSpeechText(openCard));
                    }
                }
            });

            window.addEventListener('pagehide', stopSpeaking);
            window.addEventListener('beforeunload', stopSpeaking);
            document.addEventListener('visibilitychange', function () {
                if (document.hidden) {
                    stopSpeaking();
                }
            });

            updateToggleUI();
            renderLanguage(detectInitialLanguage());
        })();
    </script>
<script src="docs-nav.js"></script>
</body>
</html>
