<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Feedback — AIR²Aim</title>
    <style>
        :root {
            --text-primary: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.72);
            --accent-ok: #9ae6b4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            color: var(--text-primary);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .bg-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #111111;
            z-index: -1;
        }

        .parallax-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-image: url('../bg1.jpg');
            transform: scale(1.05);
            animation: bgInitialZoom 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @media (max-width: 768px) {
            .parallax-bg {
                background-image: url('../bg2.jpg');
            }
        }

        @keyframes bgInitialZoom {
            0% {
                opacity: 0;
                transform: scale(1.12);
            }
            30% {
                opacity: 0.5;
            }
            100% {
                opacity: 1;
                transform: scale(1.05);
            }
        }

        @keyframes contentFadeIn {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .standalone-container {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 48px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            animation: contentFadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards;
            opacity: 0;
        }

        @media (max-width: 768px) {
            .standalone-container {
                padding: 18px 18px 24px 18px;
            }
        }

        .page-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
        }

        .page-brand-sm {
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            word-spacing: -0.15em;
            color: #ffffff;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        .page-brand-sm:hover {
            opacity: 0.85;
        }

        .top-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lang-dropdown {
            position: relative;
        }

        .lang-globe-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #ffffff;
            font-size: 0.72rem;
            letter-spacing: 0.04em;
            padding: 5px 11px;
            border-radius: 999px;
            cursor: pointer;
            transition: border-color 0.25s ease, background-color 0.25s ease;
        }

        .lang-globe-btn:hover,
        .lang-dropdown.open .lang-globe-btn {
            background: rgba(255, 255, 255, 0.16);
            border-color: #ffffff;
        }

        .lang-menu {
            display: none;
            position: absolute;
            right: 0;
            top: calc(100% + 6px);
            min-width: 128px;
            background: rgba(20, 20, 22, 0.94);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            padding: 4px;
            z-index: 30;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        }

        .lang-dropdown.open .lang-menu {
            display: block;
        }

        .lang-option {
            width: 100%;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 0.8rem;
            text-align: left;
            padding: 7px 10px;
            border-radius: 7px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s ease;
        }

        .lang-option:hover {
            background: rgba(255, 255, 255, 0.14);
        }

        .lang-option.active {
            background: rgba(255, 255, 255, 0.2);
            font-weight: 600;
        }

        .tts-toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #ffffff;
            font-size: 0.72rem;
            letter-spacing: 0.04em;
            padding: 5px 11px;
            border-radius: 999px;
            cursor: pointer;
            transition: opacity 0.25s ease, border-color 0.25s ease, background-color 0.25s ease;
        }

        .tts-toggle-btn.active {
            background: rgba(255, 255, 255, 0.16);
            border-color: #ffffff;
            opacity: 1;
        }

        .tts-toggle-btn:not(.active) {
            opacity: 0.65;
        }

        .tts-toggle-btn .icon-mute {
            display: none;
        }

        .tts-toggle-btn:not(.active) .icon-sound {
            display: none;
        }

        .tts-toggle-btn:not(.active) .icon-mute {
            display: inline-block;
        }

        .page-body {
            margin: 16px auto;
            max-width: 820px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .page-header-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px 16px;
        }

        .page-body h2 {
            font-size: clamp(1.5rem, 2.8vw, 2rem);
            font-weight: 400;
            letter-spacing: -0.02em;
            line-height: 1.15;
            color: #ffffff;
        }

        .survey-trigger-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.32);
            color: #ffffff;
            font-size: 0.78rem;
            font-weight: 500;
            padding: 7px 14px;
            border-radius: 999px;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        .survey-trigger-btn:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: #ffffff;
            transform: translateY(-1px);
        }

        .panel-card {
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel-head {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .panel-title {
            font-size: 0.96rem;
            font-weight: 600;
            color: #ffffff;
        }

        .identity-badge {
            display: none;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--accent-ok);
            background: rgba(154, 230, 180, 0.12);
            border: 1px solid rgba(154, 230, 180, 0.32);
            padding: 3px 10px;
            border-radius: 999px;
        }

        .identity-badge.is-visible {
            display: inline-flex;
        }

        .form-label {
            display: block;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 6px;
        }

        .form-textarea {
            width: 100%;
            min-height: 150px;
            resize: vertical;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.24);
            background: rgba(12, 12, 14, 0.55);
            color: #ffffff;
            font-family: inherit;
            font-size: 0.88rem;
            line-height: 1.55;
            padding: 11px 13px;
            outline: none;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .form-textarea:focus {
            border-color: rgba(255, 255, 255, 0.65);
            background: rgba(12, 12, 14, 0.72);
        }

        .form-input {
            width: 100%;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.24);
            background: rgba(12, 12, 14, 0.55);
            color: #ffffff;
            font-family: inherit;
            font-size: 0.84rem;
            padding: 9px 12px;
            outline: none;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .form-input:focus {
            border-color: rgba(255, 255, 255, 0.65);
            background: rgba(12, 12, 14, 0.72);
        }

        .field-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
            font-size: 0.74rem;
            color: var(--text-muted);
        }

        .char-counter.is-near {
            color: #fbd38d;
        }

        .char-counter.is-max {
            color: #feb2b2;
            font-weight: 600;
        }

        .form-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 4px;
        }

        .submit-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.45);
            color: #ffffff;
            font-size: 0.84rem;
            font-weight: 600;
            padding: 9px 20px;
            border-radius: 999px;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
        }

        .submit-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.3);
            border-color: #ffffff;
        }

        .submit-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .status-msg {
            display: none;
            font-size: 0.83rem;
            line-height: 1.5;
            padding: 10px 13px;
            border-radius: 10px;
            text-shadow: none;
        }

        .status-msg.is-visible {
            display: block;
        }

        .status-msg.is-thanks {
            background: rgba(154, 230, 180, 0.16);
            border: 1px solid rgba(154, 230, 180, 0.45);
            color: #dcfce7;
        }

        .status-msg.is-warn {
            background: rgba(251, 211, 141, 0.16);
            border: 1px solid rgba(251, 211, 141, 0.45);
            color: #fef3c7;
        }

        .status-msg.is-err {
            background: rgba(254, 178, 178, 0.16);
            border: 1px solid rgba(254, 178, 178, 0.45);
            color: #fee2e2;
        }

        .survey-modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.62);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .survey-modal-backdrop.is-visible {
            display: flex;
            opacity: 1;
        }

        .survey-modal-dialog {
            width: 100%;
            max-width: 560px;
            max-height: 86vh;
            max-height: 86dvh;
            display: flex;
            flex-direction: column;
            background: rgba(24, 24, 28, 0.9);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
            overflow: hidden;
            color: #ffffff;
            text-shadow: none;
        }

        .survey-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        .survey-modal-header h3 {
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
        }

        .survey-modal-close {
            width: 30px;
            height: 30px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.28);
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            font-size: 1.1rem;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .survey-modal-body {
            padding: 16px 18px 20px 18px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .survey-placeholder-box {
            border-radius: 10px;
            border: 1px dashed rgba(255, 255, 255, 0.26);
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 14px;
            font-size: 0.82rem;
            line-height: 1.55;
            color: rgba(255, 255, 255, 0.82);
        }

        .page-footer {
            max-width: 820px;
            width: 100%;
            margin: 6px auto 0 auto;
            padding-top: 8px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 8px 16px;
            font-size: 0.74rem;
            color: var(--text-muted);
        }

        .footer-contact a {
            color: #ffffff;
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.35);
            padding-bottom: 1px;
        }

        .footer-meta {
            text-align: right;
            line-height: 1.4;
        }

        @media (max-width: 768px) {
            .footer-meta {
                text-align: left;
            }
        }
    </style>
</head>

            <section class="panel-card" aria-labelledby="freeFeedbackTitle">

                    <div class="identity-badge" id="identityBadge"></div>
                </div>

                <form id="feedbackForm" novalidate>
                    <div>
                        <label class="form-label" for="feedbackText" id="feedbackTextLabel">Your comments, suggestions, or issues (up to 1,000 characters)</label>
                        <textarea id="feedbackText" class="form-textarea" maxlength="1000" required></textarea>
                        <div class="field-meta-row">

                    <div style="margin-top: 10px;">
                        <label class="form-label" for="contactEmail" id="contactEmailLabel">Reply email (optional)</label>

                    <div class="form-actions">
                        <button type="submit" class="submit-btn" id="submitFeedbackBtn">Submit Feedback</button>
                    </div>
                </form>

                <div class="status-msg" id="feedbackStatus" role="status" aria-live="polite"></div>
            </section>
        </div>

        <footer class="page-footer">
            <div class="footer-contact">
                <span id="supportPrefix">Support: </span><a href="mailto:support@air2aim.com">support@air2aim.com</a> · <span id="footerBadge">Feedback · 2026</span>
            </div>
            <div class="footer-meta">
                Anna Intelligence Recorder & Reminder · Developed in Yerevan, Armenia · 2026
            </div>
        </footer>
    </div>

                <h3 id="surveyModalTitle">Quick Survey</h3>
                <button type="button" class="survey-modal-close" id="surveyModalClose" aria-label="Close">×</button>

            function parseFragmentContext() {
                const rawHash = (window.location.hash || '').replace(/^#/, '');
                const hashParams = new URLSearchParams(rawHash);
                const ctx = {};
                PARAM_KEYS.forEach(function (k) {
                    const val = hashParams.get(k);
                    if (val !== null && String(val).trim() !== '') {
                        ctx[k] = String(val).trim();
                    }
                });
                return ctx;
            }

            const fragmentCtx = parseFragmentContext();

            const pageTitle = document.getElementById('pageTitle');
            const surveyBtnText = document.getElementById('surveyBtnText');
            const freeFeedbackTitle = document.getElementById('freeFeedbackTitle');
            const identityBadge = document.getElementById('identityBadge');
            const feedbackForm = document.getElementById('feedbackForm');
            const feedbackTextLabel = document.getElementById('feedbackTextLabel');
            const feedbackText = document.getElementById('feedbackText');
            const feedbackHint = document.getElementById('feedbackHint');
            const charCounter = document.getElementById('charCounter');
            const contactEmailLabel = document.getElementById('contactEmailLabel');
            const contactEmail = document.getElementById('contactEmail');
            const submitFeedbackBtn = document.getElementById('submitFeedbackBtn');
            const feedbackStatus = document.getElementById('feedbackStatus');
            const supportPrefix = document.getElementById('supportPrefix');
            const footerBadge = document.getElementById('footerBadge');

            const currentLangCode = document.getElementById('currentLangCode');
            const langDropdown = document.getElementById('langDropdown');
            const langGlobeBtn = document.getElementById('langGlobeBtn');
            const langOptions = document.querySelectorAll('.lang-option');
            const ttsToggle = document.getElementById('ttsToggle');
            const ttsLabel = document.getElementById('ttsLabel');

            const openSurveyBtn = document.getElementById('openSurveyBtn');
            const surveyModalBackdrop = document.getElementById('surveyModalBackdrop');
            const surveyModalClose = document.getElementById('surveyModalClose');
            const surveyModalTitle = document.getElementById('surveyModalTitle');
            const surveyPlaceholderDesc = document.getElementById('surveyPlaceholderDesc');
            const submitSurveyBtn = document.getElementById('submitSurveyBtn');
            const surveyStatus = document.getElementById('surveyStatus');

            const supportsTTS = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
            let isTtsEnabled = supportsTTS;
            let activeLang = 'en';
            let isSubmitting = false;
            let speechSessionId = 0;
            const activeUtterances = [];

            function detectInitialLanguage() {
                const fragLang = (fragmentCtx.lang || '').toLowerCase().split('-')[0];
                if (fragLang && Object.prototype.hasOwnProperty.call(I18N, fragLang)) {
                    return fragLang;
                }

                const params = new URLSearchParams(window.location.search);
                const queryLang = (params.get('lang') || '').toLowerCase().split('-')[0];
                if (queryLang && Object.prototype.hasOwnProperty.call(I18N, queryLang)) {
                    return queryLang;
                }

                const systemLangs = Array.isArray(navigator.languages) && navigator.languages.length > 0
                    ? navigator.languages
                    : [navigator.language || navigator.userLanguage || 'en'];

                for (let i = 0; i < systemLangs.length; i++) {
                    const code = String(systemLangs[i] || '').toLowerCase().trim();
                    const base = code.split('-')[0];
                    if (Object.prototype.hasOwnProperty.call(I18N, base)) {
                        return base;
                    }
                }
                return 'en';
            }

            function stopSpeaking() {
                speechSessionId += 1;
                activeUtterances.length = 0;
                if (supportsTTS) {
                    window.speechSynthesis.cancel();
                }
            }

            function speakText(text) {
                if (!supportsTTS || !isTtsEnabled || !text) return;
                stopSpeaking();
                const sessionId = speechSessionId;
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = I18N[activeLang]?.ttsLang || 'en-US';
                utterance.rate = 0.95;
                utterance.onstart = function () {
                    if (sessionId !== speechSessionId) {
                        window.speechSynthesis.cancel();
                    }
                };
                activeUtterances.push(utterance);
                window.speechSynthesis.speak(utterance);
            }

            function updateToggleUI() {
                if (!supportsTTS) {
                    ttsLabel.textContent = 'off';
                    ttsToggle.classList.remove('active');
                    return;
                }
                ttsLabel.textContent = isTtsEnabled ? 'on' : 'off';
                ttsToggle.classList.toggle('active', isTtsEnabled);
            }

            function updateCharCounter() {
                const len = feedbackText.value.length;
                charCounter.textContent = len + ' / ' + MAX_CHARS;
                charCounter.classList.toggle('is-near', len >= 850 && len < MAX_CHARS);
                charCounter.classList.toggle('is-max', len >= MAX_CHARS);
            }

            function renderIdentity(pack) {
                if (fragmentCtx.email) {
                    identityBadge.textContent = pack.accountPrefix + fragmentCtx.email;
                    identityBadge.classList.add('is-visible');
                    if (!contactEmail.value) {
                        contactEmail.value = fragmentCtx.email;
                    }
                } else if (fragmentCtx.uid) {
                    identityBadge.textContent = pack.uidPrefix + fragmentCtx.uid;
                    identityBadge.classList.add('is-visible');
                } else {
                    identityBadge.textContent = '';
                    identityBadge.classList.remove('is-visible');
                }
            }

            function renderLanguage(langKey) {
                const pack = I18N[langKey] || I18N.en;
                activeLang = Object.prototype.hasOwnProperty.call(I18N, langKey) ? langKey : 'en';
                stopSpeaking();

                document.documentElement.lang = pack.htmlLang;
                document.title = pack.docTitle;
                pageTitle.textContent = pack.heading;
                surveyBtnText.textContent = pack.surveyBtn;
                freeFeedbackTitle.textContent = pack.freeTitle;
                feedbackTextLabel.textContent = pack.textLabel;
                feedbackText.placeholder = pack.textPlaceholder;
                feedbackHint.textContent = pack.textHint;
                contactEmailLabel.textContent = pack.emailLabel;
                contactEmail.placeholder = pack.emailPlaceholder;
                submitFeedbackBtn.textContent = isSubmitting ? pack.submittingBtn : pack.submitBtn;

                surveyModalTitle.textContent = pack.surveyTitle;
                surveyPlaceholderDesc.textContent = pack.surveyDesc;
                submitSurveyBtn.textContent = pack.surveySubmit;

                supportPrefix.textContent = pack.supportPrefix;
                footerBadge.textContent = pack.footerBadge;
                currentLangCode.textContent = pack.label;

                langOptions.forEach(function (opt) {
                    opt.classList.toggle('active', opt.getAttribute('data-lang') === activeLang);
                });

                renderIdentity(pack);
            }

            function showStatus(el, msg, typeClass) {
                el.textContent = msg;
                el.className = 'status-msg is-visible ' + typeClass;
            }

            async function insertToSupabase(payload) {
                const res = await fetch(FEEDBACK_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_KEY,
                        'Authorization': 'Bearer ' + SUPABASE_KEY,
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) {
                    const errText = await res.text().catch(function () { return ''; });
                    throw new Error('HTTP ' + res.status + ' ' + errText);
                }
            }

            feedbackText.addEventListener('input', function () {
                if (feedbackText.value.length > MAX_CHARS) {
                    feedbackText.value = feedbackText.value.slice(0, MAX_CHARS);
                }
                updateCharCounter();
            });

            feedbackForm.addEventListener('submit', async function (e) {
                e.preventDefault();
                if (isSubmitting) return;

                const pack = I18N[activeLang] || I18N.en;
                const content = feedbackText.value.trim();
                if (!content) {
                    showStatus(feedbackStatus, pack.emptyWarn, 'is-warn');
                    feedbackText.focus();
                    return;
                }

                const emailVal = contactEmail.value.trim() || fragmentCtx.email || null;
                const payload = {
                    feedback_type: 'free_text',
                    content: content,
                    contact_email: emailVal,
                    uid: fragmentCtx.uid || null,
                    lang: fragmentCtx.lang || activeLang,
                    app_version: fragmentCtx.version || null,
                    platform: fragmentCtx.platform || 'web',
                    os_version: fragmentCtx.os_version || null,
                    sdk: fragmentCtx.sdk || null,
                    brand: fragmentCtx.brand || null,
                    manufacturer: fragmentCtx.manufacturer || null,
                    model: fragmentCtx.model || null,
                    page_url: window.location.pathname
                };

                isSubmitting = true;
                submitFeedbackBtn.disabled = true;
                submitFeedbackBtn.textContent = pack.submittingBtn;
                feedbackStatus.className = 'status-msg';

                try {
                    await insertToSupabase(payload);
                    feedbackText.value = '';
                    updateCharCounter();
                    showStatus(feedbackStatus, pack.thanksMsg, 'is-thanks');
                    speakText(pack.thanksMsg);
                } catch (err) {
                    console.error('Feedback submit failed:', err);
                    showStatus(feedbackStatus, pack.errorMsg, 'is-err');
                } finally {
                    isSubmitting = false;
                    submitFeedbackBtn.disabled = false;
                    const currentPack = I18N[activeLang] || I18N.en;
                    submitFeedbackBtn.textContent = currentPack.submitBtn;
                }
            });

            function openSurveyModal() {
                surveyStatus.className = 'status-msg';
                surveyStatus.textContent = '';
                surveyModalBackdrop.classList.add('is-visible');
                document.body.style.overflow = 'hidden';
            }

            function closeSurveyModal() {
                surveyModalBackdrop.classList.remove('is-visible');
                document.body.style.overflow = '';
            }

            openSurveyBtn.addEventListener('click', openSurveyModal);
            surveyModalClose.addEventListener('click', closeSurveyModal);
            surveyModalBackdrop.addEventListener('click', function (e) {
                if (e.target === surveyModalBackdrop) {
                    closeSurveyModal();
                }
            });

            submitSurveyBtn.addEventListener('click', function () {
                const pack = I18N[activeLang] || I18N.en;
                showStatus(surveyStatus, pack.surveyThanks, 'is-thanks');
                speakText(pack.surveyThanks);
            });

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && surveyModalBackdrop.classList.contains('is-visible')) {
                    closeSurveyModal();
                }
            });

            langGlobeBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                const willOpen = !langDropdown.classList.contains('open');
                langDropdown.classList.toggle('open', willOpen);
                langGlobeBtn.setAttribute('aria-expanded', String(willOpen));
            });

            langOptions.forEach(function (opt) {
                opt.addEventListener('click', function (e) {
                    e.stopPropagation();
                    const chosen = opt.getAttribute('data-lang');
                    langDropdown.classList.remove('open');
                    langGlobeBtn.setAttribute('aria-expanded', 'false');
                    renderLanguage(chosen);
                });
            });

            document.addEventListener('click', function (e) {
                if (!langDropdown.contains(e.target)) {
                    langDropdown.classList.remove('open');
                    langGlobeBtn.setAttribute('aria-expanded', 'false');
                }
            });

            ttsToggle.addEventListener('click', function () {
                if (!supportsTTS) return;
                isTtsEnabled = !isTtsEnabled;
                updateToggleUI();
                if (!isTtsEnabled) {
                    stopSpeaking();
                }
            });

            window.addEventListener('pagehide', stopSpeaking);
            window.addEventListener('beforeunload', stopSpeaking);
            document.addEventListener('visibilitychange', function () {
                if (document.hidden) {
                    stopSpeaking();
                }
            });

            updateToggleUI();
            updateCharCounter();
            renderLanguage(detectInitialLanguage());
        })();
    </script>
