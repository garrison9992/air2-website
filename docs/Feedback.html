<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Feedback — AIR²Aim</title>
    <style>
        :root {
            --text-primary: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.72);
            --accent-ok: #9ae6b4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            color: var(--text-primary);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .bg-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #111111;
            z-index: -1;
        }

        .parallax-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-image: url('../bg1.jpg');
            transform: scale(1.05);
            animation: bgInitialZoom 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @media (max-width: 768px) {
            .parallax-bg {
                background-image: url('../bg2.jpg');
            }
        }

        @keyframes bgInitialZoom {
            0% {
                opacity: 0;
                transform: scale(1.12);
            }
            30% {
                opacity: 0.5;
            }
            100% {
                opacity: 1;
                transform: scale(1.05);
            }
        }

        @keyframes contentFadeIn {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .standalone-container {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 48px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            animation: contentFadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards;
            opacity: 0;
        }

        @media (max-width: 768px) {
            .standalone-container {
                padding: 18px 18px 24px 18px;
            }
        }

        .page-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
        }

        .page-brand-sm {
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            word-spacing: -0.15em;
            color: #ffffff;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        .page-brand-sm:hover {
            opacity: 0.85;
        }

        .top-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lang-dropdown {
            position: relative;
        }

        .lang-globe-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #ffffff;
            font-size: 0.72rem;
            letter-spacing: 0.04em;
            padding: 5px 11px;
            border-radius: 999px;
            cursor: pointer;
            transition: border-color 0.25s ease, background-color 0.25s ease;
        }

        .lang-globe-btn:hover,
        .lang-dropdown.open .lang-globe-btn {
            background: rgba(255, 255, 255, 0.16);
            border-color: #ffffff;
        }

        .lang-menu {
            display: none;
            position: absolute;
            right: 0;
            top: calc(100% + 6px);
            min-width: 128px;
            background: rgba(20, 20, 22, 0.94);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            padding: 4px;
            z-index: 30;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        }

        .lang-dropdown.open .lang-menu {
            display: block;
        }

        .lang-option {
            width: 100%;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 0.8rem;
            text-align: left;
            padding: 7px 10px;
            border-radius: 7px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s ease;
        }

        .lang-option:hover {
            background: rgba(255, 255, 255, 0.14);
        }

        .lang-option.active {
            background: rgba(255, 255, 255, 0.2);
            font-weight: 600;
        }

        .tts-toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #ffffff;
            font-size: 0.72rem;
            letter-spacing: 0.04em;
            padding: 5px 11px;
            border-radius: 999px;
            cursor: pointer;
            transition: opacity 0.25s ease, border-color 0.25s ease, background-color 0.25s ease;
        }

        .tts-toggle-btn.active {
            background: rgba(255, 255, 255, 0.16);
            border-color: #ffffff;
            opacity: 1;
        }

        .tts-toggle-btn:not(.active) {
            opacity: 0.65;
        }

        .tts-toggle-btn .icon-mute {
            display: none;
        }

        .tts-toggle-btn:not(.active) .icon-sound {
            display: none;
        }

        .tts-toggle-btn:not(.active) .icon-mute {
            display: inline-block;
        }

        .page-body {
            margin: 16px auto;
            max-width: 820px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .page-header-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px 16px;
        }

        .page-body h2 {
            font-size: clamp(1.5rem, 2.8vw, 2rem);
            font-weight: 400;
            letter-spacing: -0.02em;
            line-height: 1.15;
            color: #ffffff;
        }

        .survey-trigger-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.32);
            color: #ffffff;
            font-size: 0.78rem;
            font-weight: 500;
            padding: 7px 14px;
            border-radius: 999px;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        .survey-trigger-btn:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: #ffffff;
            transform: translateY(-1px);
        }

        .panel-card {
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel-head {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .panel-title {
            font-size: 0.96rem;
            font-weight: 600;
            color: #ffffff;
        }

        .identity-badge {
            display: none;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--accent-ok);
            background: rgba(154, 230, 180, 0.12);
            border: 1px solid rgba(154, 230, 180,
